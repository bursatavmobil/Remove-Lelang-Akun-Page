<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapus Akun - TAV Lelang</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <svg class="icon-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
                <h1>Konfirmasi Hapus Akun</h1>
            </div>

            <p class="description">
                Tindakan ini akan menghapus seluruh data Anda secara permanen dari sistem TAV Lelang dan tidak dapat
                dibatalkan.
            </p>

            <div id="status-message" class="hidden"></div>

            <div class="actions">
                <button id="btn-cancel" class="btn btn-secondary">Batal</button>
                <button id="btn-delete" class="btn btn-danger">Ya, Hapus Akun</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
