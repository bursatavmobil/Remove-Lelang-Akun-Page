<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapus Akun - TAV Lelang</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="minimal-container">
        <h1 class="minimal-heading">Hapus Akun.</h1>

        <div class="minimal-card">
            <p class="description">
                Tindakan ini akan menghapus seluruh data Anda secara permanen dari sistem TAV Lelang dan tidak dapat
                dibatalkan.
            </p>

            <div id="status-message" class="hidden"></div>

            <div class="actions">
                <button id="btn-cancel" class="btn btn-secondary">Batal</button>
                <button id="btn-delete" class="btn btn-danger">Ya, Hapus Akun</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert -->
    <div id="custom-alert" class="alert-overlay hidden">
        <div class="minimal-card alert-box animate-fade-in">
            <h3>Konfirmasi Penghapusan</h3>
            <p>Apakah Anda benar-benar yakin ingin menghapus akun dan data ini secara permanen?</p>
            <div class="actions" style="margin-top: 24px;">
                <button id="alert-btn-no" class="btn btn-secondary">Tidak</button>
                <button id="alert-btn-yes" class="btn btn-danger">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
